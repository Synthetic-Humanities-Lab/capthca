<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f5f5">
    <meta name="description" content="Select all images that are not AI-generated. Verify that you are human.">
    <meta name="author" content="Synthetic Humanities Lab">
    <title>CAPTHCA</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main>
      <section class="captcha" aria-labelledby="instruction">
        <header class="prompt">
          <span>Select all images that are</span>
          <h1 id="instruction">not <span>AI-generated</span></h1>
          <p>Click Verify once you have made your selection.</p>
        </header>
        <div class="grid" role="group" aria-label="Image selection" aria-busy="true"></div>
        <footer class="controls">
          <div class="identity" aria-label="CAPTHCA">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6M15 3h6v6M21 15v6h-6M9 21H3v-6"/><path d="m7 12 3 3 7-7"/></svg>
            <span>CAPTHCA</span>
          </div>
          <button class="verify" type="button" disabled>Verify</button>
        </footer>
        <p class="notice" role="status">Loading images…</p>
      </section>
      <section class="verdict" hidden aria-labelledby="result">
        <h1 id="result" tabindex="-1"></h1>
      </section>
      <noscript>This verification requires JavaScript.</noscript>
    </main>
  </body>
</html>
